<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ფურთი — Purti</title>
<meta name="description" content="ფურთი — the Georgian card game of elevens. Play online with a friend.">
<meta name="theme-color" content="#2a0b13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%2710%27 y=%274%27 width=%2744%27 height=%2756%27 rx=%277%27 fill=%27%237a1a2d%27 stroke=%27%23e2bc6a%27 stroke-width=%274%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2730%27 text-anchor=%27middle%27 fill=%27%23e2bc6a%27 font-family=%27serif%27%3E%E1%83%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#2a0b13; --wine2:#3d0f1b; --felt1:#7d2033; --felt2:#4a0f1c;
  --gold:#e2bc6a; --gold2:#b8862f; --cream:#f8f0de; --muted:#cdb7a4;
  --red:#b81f2f; --ink:#1f1b1b;
  --serif:"Noto Serif Georgian", Georgia, "Times New Roman", serif;
  --sans:"Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw:min(20vw, 15vh, 108px);
  --tw:min(14.5vw, 11vh, 86px);
  --bw:min(10vw, 8vh, 58px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);color:var(--cream);
  background:
    radial-gradient(1200px 600px at 50% -10%, #5a1626 0%, transparent 60%),
    radial-gradient(900px 500px at 50% 120%, #3a0c17 0%, transparent 60%),
    var(--wine);
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.hidden{display:none!important}
.screen{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:15px 18px;border-radius:16px;font-weight:700;font-size:16px;letter-spacing:.2px;
  transition:transform .12s ease, filter .2s ease, background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#f2d58f,var(--gold) 45%,var(--gold2));color:#2a1406;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 8px 22px rgba(226,188,106,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(226,188,106,.35);color:var(--cream)}
.btn.ghost:hover{background:rgba(226,188,106,.1)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(226,188,106,.25);font-size:17px;font-weight:700;flex:none}
.icon-btn:hover{background:rgba(226,188,106,.14)}
.lang-switch{display:flex;align-items:center;height:40px;padding:3px;gap:2px;border-radius:20px;flex:none;
  background:rgba(255,255,255,.06);border:1px solid rgba(226,188,106,.25)}
.lang-switch button{height:100%;min-width:34px;padding:0 9px;border-radius:16px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.lang-switch button:hover{color:var(--cream)}
.lang-switch button.on{background:linear-gradient(180deg,#f2d58f,var(--gold) 45%,var(--gold2));color:#2a1406;font-weight:800}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto}
.home-top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px)}
.home-inner{width:min(420px,92vw);display:flex;flex-direction:column;align-items:center;padding:28px 0}
.fan{position:relative;height:calc(var(--fw) * 1.45);width:calc(var(--fw) * 2.6);--fw:min(26vw,96px);margin-bottom:34px}
.fan .card{--w:var(--fw);position:absolute;left:50%;top:6px;transform-origin:50% 120%}
.fan .card:nth-child(1){transform:translateX(-50%) rotate(-16deg)}
.fan .card:nth-child(2){transform:translateX(-50%) translateY(-6px);z-index:2}
.fan .card:nth-child(3){transform:translateX(-50%) rotate(16deg)}
h1.logo{font-family:var(--serif);font-weight:800;font-size:clamp(56px,17vw,92px);line-height:1;margin:6px 0 4px;
  background:linear-gradient(180deg,#fff1c9 0%,var(--gold) 50%,#a8772a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
.tagline{color:var(--muted);margin:0 0 26px;text-align:center;font-size:15px}
.field{width:100%;margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(226,188,106,.3);background:rgba(0,0,0,.25);color:var(--cream);font-size:16px;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,188,106,.18)}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}

/* ---------- lobby ---------- */
#lobby{display:flex;align-items:center;justify-content:center;overflow:auto}
.panel{width:min(420px,92vw);padding:26px 22px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid rgba(226,188,106,.22);box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative}
.panel h2{font-family:var(--serif);margin:0 0 16px;font-size:24px;color:var(--gold);text-align:center}
.panel .back{position:absolute;top:16px;left:16px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0 12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:rgba(226,188,106,.2)}
.size-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;color:var(--muted);font-size:15px}
.size-pick{display:flex;padding:3px;gap:3px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(226,188,106,.3)}
.size-pick button{width:52px;height:38px;border-radius:11px;font-weight:800;font-size:17px;color:var(--muted)}
.size-pick button.on{background:linear-gradient(180deg,#f2d58f,var(--gold) 45%,var(--gold2));color:#2a1406}
.join-row{display:flex;gap:10px}
.rejoin-row{display:flex;gap:8px}
.rejoin-row .forget{width:54px;flex:none;padding:0;font-size:22px;font-weight:400;color:var(--muted)}
.join-row .input{text-transform:uppercase;letter-spacing:6px;font-weight:700;text-align:center}
.join-row .btn{width:auto;padding:0 22px}
.code{font-family:var(--serif);font-size:clamp(46px,14vw,64px);font-weight:800;letter-spacing:12px;text-align:center;color:var(--cream);
  padding:12px 0 6px 12px;border-radius:16px;background:rgba(0,0,0,.25);border:1px dashed rgba(226,188,106,.4);margin:8px 0 12px}
.note{color:var(--muted);font-size:14px;text-align:center;line-height:1.5;margin:10px 0 0}
.note.err{color:#ffb3a8}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cream);margin-top:16px;font-size:15px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- game ---------- */
#game{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;max-width:1000px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.topbar .mid{flex:1;text-align:center;line-height:1.1}
.topbar .t{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--gold)}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.zone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 10px}
.tag{display:flex;align-items:center;gap:10px;font-size:14px;min-height:34px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:linear-gradient(180deg,#5b1a28,#3a0d18);border:1px solid rgba(226,188,106,.45);color:var(--gold);transition:box-shadow .3s}
.zone.active .avatar{box-shadow:0 0 0 3px rgba(226,188,106,.85),0 0 18px rgba(226,188,106,.6);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(226,188,106,.4),0 0 6px rgba(226,188,106,.2)}}
.pname{font-weight:700;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;padding:4px 9px;border-radius:20px;background:rgba(0,0,0,.28);border:1px solid rgba(226,188,106,.18);color:var(--cream);white-space:nowrap}
.chip b{color:var(--gold)}
.chip.off{border-color:#a5463c;color:#ffb3a8}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,14px);min-height:calc(var(--cw) * 1.4 + 16px);padding-top:16px}
.hand .card{--w:var(--cw)}
.opps{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:0 6px}
.opps .zone.opp{min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
/* 4 players: three compact opponents side by side */
.opps.four .zone.opp{flex:1 1 0;padding:4px 2px;gap:4px;border-radius:14px}
.opps.four .zone.opp.active{background:rgba(226,188,106,.07)}
.opps.four .tag{flex-direction:column;gap:3px;min-height:0;font-size:13px}
.opps.four .pname{max-width:100%}
.opps.four .chips{gap:3px}
.opps.four .chip{font-size:11px;padding:2px 6px}
.opps.four .avatar{width:28px;height:28px;font-size:13px}
.opps.four .opp-hand{--bw:min(7vw,5.5vh,40px)}
.opp-hand{display:flex;justify-content:center;min-height:calc(var(--bw) * 1.4)}
.opp-hand .card{--w:var(--bw)}
.opp-hand .card + .card{margin-left:calc(var(--bw) * -0.42)}
.opp-hand .card:nth-child(1){transform:rotate(-7deg) translateY(2px)}
.opp-hand .card:nth-child(2){transform:rotate(-2deg)}
.opp-hand .card:nth-child(3){transform:rotate(2deg)}
.opp-hand .card:nth-child(4){transform:rotate(7deg) translateY(2px)}

.felt{position:relative;margin:6px clamp(8px,3vw,22px);border-radius:clamp(22px,5vw,40px);min-height:0;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.07), transparent 55%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 2px, transparent 2px 6px),
    radial-gradient(ellipse at 50% 45%, var(--felt1), var(--felt2) 72%, #370a14);
  box-shadow:inset 0 0 0 2px rgba(226,188,106,.32), inset 0 0 80px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.felt:before{content:"";position:absolute;inset:10px;border-radius:inherit;border:1px dashed rgba(226,188,106,.22);pointer-events:none}
.felt-mark{position:absolute;font-family:var(--serif);font-weight:800;font-size:clamp(60px,20vw,150px);color:rgba(226,188,106,.06);pointer-events:none;user-select:none}
.table-cards{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(6px,1.6vw,12px);padding:18px;max-width:100%;max-height:100%}
.table-cards .card{--w:var(--tw)}
.table-empty{color:rgba(248,240,222,.35);font-size:14px;position:relative}

.statusbar{display:flex;align-items:center;gap:10px;padding:6px 16px;min-height:40px}
.deckmini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none}
.deckmini .card{--w:22px;border-width:1.5px}
.deckmini .card:after{font-size:9px}
.status{flex:1;text-align:center;font-weight:600;font-size:15px;color:var(--cream);min-height:22px}
.status.mine{color:var(--gold)}
.statusbar .spacer{width:48px;flex:none;text-align:right;font-size:12px;color:var(--muted)}

/* ---------- cards ---------- */
.card{--w:80px;width:var(--w);height:calc(var(--w) * 1.4);border-radius:calc(var(--w) * .11);flex:none;position:relative;
  background:linear-gradient(160deg,#fffdf7 0%,#f6eedd 60%,#ede1c6 100%);color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 rgba(0,0,0,.18),0 8px 16px rgba(0,0,0,.35);
  font-family:var(--serif);user-select:none;-webkit-user-select:none;transition:transform .18s ease, box-shadow .18s ease, opacity .3s}
.card.red{color:var(--red)}
.card .tl,.card .br{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-weight:800;font-size:calc(var(--w) * .22)}
.card .tl{left:7%;top:6%}
.card .br{right:7%;bottom:6%;transform:rotate(180deg)}
.card .tl .s,.card .br .s{font-size:.78em;margin-top:1px}
.card .tl.ten,.card .br.ten{letter-spacing:-.08em;font-size:calc(var(--w) * .19)}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w) * .5);line-height:1}
.card .face{width:50%;height:56%;border-radius:calc(var(--w) * .06);display:grid;place-items:center;
  border:1.5px solid currentColor;font-size:calc(var(--w) * .34);font-weight:800;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 3px, transparent 3px 6px)}
.card.jack .face{border:2px solid var(--gold2);background:radial-gradient(circle at 50% 40%,#fff7dc,#f1d995);color:#7a4b10;box-shadow:inset 0 0 0 2px #fffaf0}
.card.jack{box-shadow:0 0 0 1.5px rgba(184,134,47,.7),0 2px 0 rgba(0,0,0,.18),0 8px 16px rgba(0,0,0,.35)}
.card.back{background:
    radial-gradient(circle at 50% 50%, rgba(226,188,106,.25) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, rgba(226,188,106,.22) 0 1.5px, transparent 1.5px 8px),
    repeating-linear-gradient(-45deg, rgba(226,188,106,.22) 0 1.5px, transparent 1.5px 8px),
    linear-gradient(160deg,#86203a,#4c0e1d);
  border:calc(var(--w) * .05) solid #f6eedb}
.card.back:after{content:"ფ";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--gold);font-size:calc(var(--w) * .32);text-shadow:0 1px 2px rgba(0,0,0,.5)}

.hand.can .card{cursor:pointer}
@media (hover:hover){.hand.can .card:hover{transform:translateY(-8px)}}
.hand .card.sel{transform:translateY(-16px)!important;box-shadow:0 0 0 3px var(--gold),0 14px 26px rgba(0,0,0,.5)}
.hand:not(.can) .card{filter:saturate(.85) brightness(.92)}
.table-cards.can .card{cursor:pointer}
.table-cards .card.picked{transform:translateY(-7px);box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(226,188,106,.7)}
.status.err{color:#ffb3a8}
.card.taking{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(226,188,106,.85)!important;transform:translateY(-5px) scale(1.04)}
.card.gone-down{transform:translateY(200px) scale(.5) rotate(8deg)!important;opacity:0;transition:transform .4s ease-in, opacity .4s ease-in}
.card.gone-up{transform:translateY(-200px) scale(.5) rotate(-8deg)!important;opacity:0;transition:transform .4s ease-in, opacity .4s ease-in}
.card.in-me{animation:inMe .38s cubic-bezier(.2,.8,.2,1)}
.card.in-opp{animation:inOpp .38s cubic-bezier(.2,.8,.2,1)}
.card.deal{animation:dealIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes inMe{from{transform:translateY(160px) scale(.85);opacity:0}}
@keyframes inOpp{from{transform:translateY(-160px) scale(.85);opacity:0}}
@keyframes dealIn{from{transform:translateY(-60px) rotate(-10deg) scale(.7);opacity:0}}

/* ---------- toast & modals ---------- */
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;z-index:40;
  font-family:var(--serif);font-weight:800;font-size:clamp(56px,18vw,120px);color:var(--gold);
  text-shadow:0 4px 0 #6b4310,0 10px 40px rgba(0,0,0,.6);opacity:0}
#toast.show{animation:toast 1.3s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(18,4,8,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(460px,100%);max-height:88dvh;overflow:auto;border-radius:24px;padding:24px 22px;
  background:linear-gradient(180deg,#42111e,#2a0b13);border:1px solid rgba(226,188,106,.3);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet h3{font-family:var(--serif);color:var(--gold);font-size:26px;margin:0 0 14px;text-align:center}
.sheet .btn{margin-top:10px}
.result-title{font-family:var(--serif);font-size:clamp(34px,10vw,46px);font-weight:800;text-align:center;margin:4px 0 6px;color:var(--gold)}
.result-sub{text-align:center;color:var(--muted);margin-bottom:18px}
.rtable{width:100%;border-collapse:collapse;margin-bottom:10px}
.rtable td,.rtable th{padding:10px 8px;text-align:center;border-bottom:1px solid rgba(226,188,106,.15)}
.rtable th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.rtable td:first-child,.rtable th:first-child{text-align:left}
.rtable.four td,.rtable.four th{padding:9px 3px;font-size:14px}
.rtable.four .pt{margin-left:2px;padding:1px 5px;font-size:11px}
.rtable.four th .nm{max-width:16vw}
.rtable th .nm{display:inline-block;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;text-transform:none;letter-spacing:0;font-size:13px;color:var(--cream)}
.rtable td.got{color:var(--cream);font-weight:700}
.rtable .pt{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(226,188,106,.18);color:var(--gold);border:1px solid rgba(226,188,106,.4)}
.rtable tr.total td{font-weight:800;font-size:18px;border-bottom:0;border-top:1px solid rgba(226,188,106,.4)}
.rtable tr.total td.win{color:var(--gold);font-size:22px}
.rtable tr.total.match td{border-top:0;font-size:15px;color:var(--muted)}
.rtable tr.total.match td.win{color:var(--gold);font-size:22px}
.target-row{width:100%;margin:0 0 16px}
.rtable .red,.chip b.red{color:#ff8f8f}
.btn-row{display:flex;gap:10px}

@media (min-width:700px){
  :root{--cw:min(13vw,15vh,118px);--tw:min(10vw,11.5vh,94px)}
  .topbar{padding:16px 18px 6px}
}
@media (max-height:520px){
  .topbar{padding:4px 10px 0}.topbar .sub{display:none}
  .zone{gap:4px;padding:2px 10px}.hand{padding-top:10px}
  .zone .tag{min-height:26px}
}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen">
  <div class="home-top"><div class="lang-switch" role="group" aria-label="Language"></div></div>
  <div class="home-inner">
    <div class="fan" id="fan"></div>
    <h1 class="logo">ფურთი</h1>
    <p class="tagline" data-i="tagline"></p>
    <div class="field">
      <label for="nameInput" data-i="yourName"></label>
      <input id="nameInput" class="input" maxlength="16" autocomplete="off">
    </div>
    <div class="size-row target-row"><span data-i="playTo"></span>
      <div class="size-pick target-pick" role="group"><button type="button" data-act="target" data-target="11">11</button><button type="button" data-act="target" data-target="21">21</button></div>
    </div>
    <div class="stack">
      <button class="btn primary" data-act="friend"><span>👥</span><span data-i="playFriend"></span></button>
      <button class="btn ghost" data-act="ai"><span>🤖</span><span data-i="playAI"></span></button>
      <div class="rejoin-row hidden" id="rejoinRow">
        <button class="btn ghost" id="rejoinBtn" data-act="rejoin"></button>
        <button class="btn ghost forget" id="forgetBtn" data-act="forget">×</button>
      </div>

/* ================= cards & rules engine ================= */

const rank = id => id.slice(0,-1);
const suit = id => id.slice(-1);

function rnd(n){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }catch(e){ return Math.floor(Math.random()*n); } }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// every group this card may take from the table (the player picks one, or none):
// a number card: any set of number cards making 11 with it; K/Q: one card of the same rank;
// the Jack: everything except Q and K (no choice, it always takes that)
function captureOptions(card, table){
  const r = rank(card);
  if (r === "J"){ const all = table.filter(c => rank(c) !== "Q" && rank(c) !== "K"); return all.length ? [all] : []; }
  if (r === "Q" || r === "K") return table.filter(c => rank(c) === r).map(c => [c]);
  const target = 11 - val(r);
  const nums = table.filter(c => val(rank(c)) !== null).slice(0, 16);
  const out = [];
  for (let mask = 1; mask < (1 << nums.length); mask++){
    let sum = 0; const pick = [];
    for (let i = 0; i < nums.length; i++) if (mask & (1 << i)){ sum += val(rank(nums[i])); pick.push(nums[i]); }
    if (sum === target) out.push(pick);
  }
  return out;
}
const sameSet = (a, b) => a.length === b.length && a.every(c => b.includes(c));
// is "take" a group this card may take? (an empty pick is always allowed: the card is just put down)
function validTake(card, take, table){
  if (!take.length) return true;
  if (new Set(take).size !== take.length || !take.every(c => table.includes(c))) return false;
  return captureOptions(card, table).some(o => sameSet(o, take));
}
// the most valuable group a card could take (used by the computer to judge risk)
function captureFor(card, table){
  let best = [];
  for (const o of captureOptions(card, table)) if (worth(o) > worth(best)) best = o;
  return best;
}

// 4 cards to each player, starting with whoever's turn it is
function deal(s){
  const n = s.p.length;
  for (let i = 0; i < 4; i++) for (let k = 0; k < n; k++) if (s.deck.length) s.h[(s.turn + k) % n].push(s.deck.pop());
}
const zeros = n => Array(n).fill(0);

const STATE_V = 3;   // bump when the saved game format changes; older saved games are replaced
// a new round; it continues the match of "prev" unless that match is finished (then a new match starts)
function newRound(mode, players, prev, target){
  const deck = [];
  for (const su of "SHDC") for (const r of RANKS) deck.push(r + su);
  shuffle(deck);
  const table = [];
  while (table.length < 4){ const c = deck.pop(); if (rank(c) === "J") deck.unshift(c); else table.push(c); }
  const n = players.length;
  const cont = prev && !prev.mover;                      // same match, next round
  const starter = prev ? (prev.starter + 1) % n : 0;   // the first player moves round by round
  const s = { v:STATE_V, id:rid(), seq:(prev ? prev.seq + 1 : 1), mode, p:players, deck, table, h:players.map(() => []),
    cap:zeros(n), cl:zeros(n), c2:-1, d10:-1, last:-1, turn:starter, starter, over:false, res:null,
    match: cont ? prev.match : rid(),                    // id of this match (its result is saved once under it)
    target: cont ? prev.target : (target || (prev && prev.target) || 11),
    tot: cont ? prev.tot.slice() : zeros(n),             // match points so far
    mover:false, mw:-1,                                  // match over? match winner
    round: cont ? prev.round + 1 : 1, lm:null, mn:0 };
  deal(s);
  return s;
}

// player pi takes these cards: count them, count clubs, and note who has 2♣ and 10♦
function collect(s, pi, cards){
  for (const c of cards){
    if (suit(c) === "C") s.cl[pi]++;
    if (c === "2C") s.c2 = pi;
    if (c === "10D") s.d10 = pi;
  }
  s.cap[pi] += cards.length;
}

// index of the single highest value, or -1 if the top is shared
function lead(a){
  const top = Math.max(...a);
  return a.indexOf(top) === a.lastIndexOf(top) ? a.indexOf(top) : -1;
}

// 5 points a round: most cards 2, 2♣ 1, 10♦ 1, most clubs 1.
// A shared lead in cards or clubs earns nobody those points; a shared top score is a draw (w = -1).
function scoreRound(s){
  const most = lead(s.cap), clubs = lead(s.cl);
  const pts = zeros(s.p.length);
  if (most >= 0) pts[most] += 2;
  if (s.c2 >= 0) pts[s.c2] += 1;
  if (s.d10 >= 0) pts[s.d10] += 1;
  if (clubs >= 0) pts[clubs] += 1;
  return { w: lead(pts), pts, most, clubs };
}

// player pi plays "card" and takes "take" (cards they picked on the table; [] = take nothing).
// Returns the new state, or null if the move isn't allowed.
function applyMove(s0, pi, card, take){
  const s = clone(s0);
  const hi = s.h[pi].indexOf(card);
  if (hi < 0 || s.turn !== pi || s.over) return null;
  let took;
  if (rank(card) === "J") took = (captureOptions(card, s.table)[0] || []);   // the Jack always takes its haul
  else {
    took = (take || []).slice();
    if (!validTake(card, took, s.table)) return null;
  }
  s.h[pi].splice(hi, 1);
  const tb = s.table.slice();
  if (took.length){
    s.table = s.table.filter(c => !took.includes(c));
    collect(s, pi, took.concat([card]));
    s.last = pi;
  } else s.table.push(card);
  s.mn++;
  s.lm = { n:s.mn, by:pi, c:card, tb, t:took };
  s.turn = (pi + 1) % s.p.length;
  if (s.h.every(h => !h.length)){
    if (s.deck.length) deal(s);
    else {
      collect(s, s.last >= 0 ? s.last : pi, s.table);   // leftovers go to whoever took last
      s.table = [];
      s.over = true;
      s.res = scoreRound(s);
      s.res.pts.forEach((p, i) => { s.tot[i] += p; });
      // the match ends once someone reaches the target and is alone on top; a tie on top plays another round
      if (Math.max(...s.tot) >= s.target && lead(s.tot) >= 0){ s.mover = true; s.mw = lead(s.tot); }
    }
  }
  s.seq++;
  return s;
}

// how much a card is worth to take: every card counts toward "most cards", clubs more, 2♣ and 10♦ most
const cardWorth = c => 10 + (suit(c) === "C" ? 6 : 0) + (c === "2C" || c === "10D" ? 45 : 0);
const worth = cards => cards.reduce((n, c) => n + cardWorth(c), 0);

// the computer's move: { card, take }
function aiChoose(s, pi){
  const hand = s.h[pi];
  let best = null, bestScore = -Infinity;
  const consider = (card, take, score) => { score += Math.random() * 1.5; if (score > bestScore){ bestScore = score; best = { card, take }; } };
  for (const c of hand){
    const opts = captureOptions(c, s.table);
    for (const took of opts){
      let score = worth(took) + cardWorth(c);
      // save the Jack for a bigger haul unless it's the last card or it grabs a point card
      if (rank(c) === "J" && took.length < 3 && hand.length > 1 && !took.some(x => x === "2C" || x === "10D")) score -= 25;
      consider(c, took, score);
    }
    if (rank(c) === "J" && opts.length) continue;      // a Jack can't be put down without taking
    // put down the card that hands the next player the least
    const nt = s.table.concat([c]);
    let risk = 0;
    for (const r of RANKS) risk = Math.max(risk, worth(captureFor(r + "S", nt)));
    consider(c, [], -risk * 0.5 - cardWorth(c) - (rank(c) === "J" ? 40 : 0));
  }
  return best;
}

function validState(g){
  try{
    if (!g || typeof g !== "object" || g.v !== STATE_V) return false;
    if (typeof g.id !== "string" || typeof g.seq !== "number") return false;
    if (!Array.isArray(g.cap) || !Array.isArray(g.cl) || typeof g.c2 !== "number" || typeof g.d10 !== "number") return false;
    if (!Array.isArray(g.p) || ![2,4].includes(g.p.length)) return false;
    const n = g.p.length;
    if (!Array.isArray(g.h) || g.h.length !== n || g.cap.length !== n || g.cl.length !== n || !Array.isArray(g.tot) || g.tot.length !== n) return false;
    if (![11, 21].includes(g.target) || typeof g.match !== "string" || typeof g.mover !== "boolean") return false;
    const all = [].concat(g.deck, g.table, ...g.h);
    if (!all.every(c => typeof c === "string" && CARD_RE.test(c))) return false;
    if (g.lm && ![g.lm.c].concat(g.lm.tb, g.lm.t).every(c => typeof c === "string" && CARD_RE.test(c))) return false;
    return Number.isInteger(g.turn) && g.turn >= 0 && g.turn < n;
  }catch(e){ return false; }
}

/* ================= card rendering ================= */
function cardHTML(id, cls = ""){
  if (!CARD_RE.test(id)) return "";
  const r = rank(id), su = SUITS[suit(id)], red = "HD".includes(suit(id));
  const face = ["J","Q","K"].includes(r);
  const ten = r === "10" ? " ten" : "";
  const mid = face ? `<div class="face">${r}</div>` : `<span>${su}</span>`;
  return `<div class="card ${red ? "red" : ""} ${r === "J" ? "jack" : ""} ${cls}" data-id="${id}">
    <div class="tl${ten}">${r}<span class="s">${su}</span></div><div class="mid">${mid}</div><div class="br${ten}">${r}<span class="s">${su}</span></div></div>`;
}
const backHTML = (cls = "") => `<div class="card back ${cls}"></div>`;

/* ================= game rendering ================= */
function initials(n){ return (n || "?").trim().slice(0,1).toUpperCase(); }

function renderFinal(){ renderState(state, null); }

function renderState(s, anim){
  if (!s) return;
  const others = seatOrder(s).slice(1);          // opponents in playing order after me
  const myN = s.mode === "ai" ? myName() : (s.p[mi] && s.p[mi].name) || myName();
  $("myName").textContent = myN; $("myAv").textContent = initials(myN);
  $("myCards").innerHTML = t("cards", {n:s.cap[mi]}); $("myClubs").innerHTML = clubsChip(s, mi);
  const moff = $("myOff");
  moff.classList.toggle("hidden", !(online && s.mode === "online" && online.connected === false));
  moff.textContent = t("reconnecting");
  $("deckCount").textContent = s.deck.length;

  // opponents: one in a 2-player game, three in a 4-player game
  const opps = $("opps");
  opps.classList.toggle("four", others.length > 1);
  opps.innerHTML = others.map(i => {
    const nm = playerName(s, i);
    // offline: true = here; a number = the server time they left (shown as the time left before the game closes)
    const ov = online && s.mode === "online" && online.onlineMap ? online.onlineMap[s.p[i].cid] : true;
    const off = ov !== true;
    const active = !s.over && s.turn === i && !anim;
    return `<div class="zone opp ${active ? "active" : ""}">
      <div class="tag"><div class="avatar">${s.mode === "ai" ? "🤖" : esc(initials(nm))}</div><span class="pname">${esc(nm)}</span>
        <span class="chips"><span class="chip">${t("cards", {n:s.cap[i]})}</span><span class="chip">${clubsChip(s, i)}</span>${off ? `<span class="chip off"${typeof ov === "number" ? ` data-gone="${ov}"` : ""}>${esc(offText(ov))}</span>` : ""}</span></div>
      <div class="opp-hand">${s.h[i].map(() => backHTML()).join("")}</div></div>`;
  }).join("");

  const tt = totalsFor(s);
  $("subline").textContent = t("round", {n:s.round}) + " · " + t("toTarget", {g:s.target})
    + (others.length === 1 ? " · " + t("vs", {n:playerName(s, others[0])}) : "")
    + (tt ? ` · ${t("allTime")} ${tt.list.map(x => x.wins).join("–")}` : "");
  // match points so far, mine first
  $("matchScore").textContent = seatOrder(s).map(i => s.tot[i]).join("–");

  // table
  const tbl = $("table");
  if (anim){
    const lm = anim;
    const cards = lm.tb.concat([lm.c]);
    tbl.innerHTML = cards.map(c => cardHTML(c, c === lm.c ? (lm.by === mi ? "in-me" : "in-opp") : "")).join("");
    if (lm.t.length) lm.t.concat([lm.c]).forEach(c => { const el = tbl.querySelector(`[data-id="${c}"]`); if (el) el.classList.add("taking"); });
  } else {
    tbl.innerHTML = s.table.length ? s.table.map(c => cardHTML(c, picks.has(c) ? "picked" : "")).join("") : `<div class="table-empty">—</div>`;
  }
  tbl.classList.toggle("can", canPlay() && !anim);

  // my hand
  const mh = $("myHand");
  const fresh = s.h[mi].filter(c => !seenHand.has(c));
  let k = 0;
  mh.innerHTML = s.h[mi].map(c => {
    const isNew = fresh.includes(c) && !anim;
    const html = cardHTML(c, (c === sel ? "sel " : "") + (isNew ? "deal" : ""));
    return isNew ? html.replace('class="card', `style="animation-delay:${(k++)*70}ms" class="card`) : html;
  }).join("");
  if (!anim) seenHand = new Set(s.h[mi]);
  mh.classList.toggle("can", canPlay() && !anim);

  // zones & status
  const myTurn = !s.over && s.turn === mi;
  $("myZone").classList.toggle("active", myTurn && !anim);
  const st = $("status");
  st.classList.toggle("mine", myTurn);
  st.classList.toggle("err", myTurn && takeErr);
  if (anim || s.over) st.textContent = "";
  else if (myTurn){
    st.textContent = takeErr ? t("badTake")
      : sel && rank(sel) === "J" ? t("tapAgain")                       // the Jack takes on its own
      : sel ? (picks.size ? t("tapAgainTake") : t("pickOrPlace"))
      : picks.size ? t("pickHand") : t("yourTurn");
  } else st.textContent = s.mode === "ai" ? t("aiThinking") : t("theirTurn", {n:playerName(s, s.turn)});
}

// seats starting with mine, then in playing order
function seatOrder(s){ const n = s.p.length; return Array.from({length:n}, (_, k) => (mi + k) % n); }
function playerName(s, i){
  if (s.mode === "ai") return i === mi ? myName() : t("computer");
  return (s.p[i] && s.p[i].name) || "…";
}
function clubsChip(s, i){ return `♣ <b>${s.cl[i]}</b>` + (s.c2 === i ? ` · <b>2♣</b>` : "") + (s.d10 === i ? ` · <b class="red">10♦</b>` : ""); }

function canPlay(){ return state && !state.over && state.turn === mi && !busy; }

function setState(ns){
  const prev = state;
  state = ns;
  if (busy){ pendingRender = true; return; }
  const sameGame = prev && prev.id === ns.id;
  if (!sameGame){ sel = null; picks = new Set(); takeErr = false; shownLm = ns.lm ? ns.lm.n : null; seenHand = new Set(); closeModal(); }
  if (ns.lm && ns.lm.n !== shownLm && sameGame) runAnim(ns.lm);
  else { renderFinal(); afterRender(); }
}

function runAnim(lm){
  busy = true; sel = null; picks = new Set(); takeErr = false; shownLm = lm.n;
  renderState(state, lm);
  const tbl = $("table");
  const dir = lm.by === mi ? "gone-down" : "gone-up";
  const hasTake = lm.t.length > 0;
  setTimeout(() => {
    if (hasTake) lm.t.concat([lm.c]).forEach(c => { const el = tbl.querySelector(`[data-id="${c}"]`); if (el) el.classList.add(dir); });
  }, hasTake ? 560 : 0);
  setTimeout(() => {
    busy = false;
    if (pendingRender){ pendingRender = false; }
    if (!state) return;                               // left the game meanwhile
    if (state.lm && state.lm.n !== shownLm) { runAnim(state.lm); return; }
    renderFinal(); afterRender();
  }, hasTake ? 1000 : 420);
}

function afterRender(){
  if (!state) return;
  if (state.over){ setTimeout(() => { if (state && state.over && !busy) showResult(); }, 650); return; }
  if (state.mode === "ai" && state.turn === 1 && !aiTimer){
    aiTimer = setTimeout(() => {
      aiTimer = null;
      if (!state || state.mode !== "ai" || state.turn !== 1 || state.over) return;
      if (busy){ afterRender(); return; }
      const mv = aiChoose(state, 1);
      const ns = applyMove(state, 1, mv.card, mv.take);
      if (ns) setState(ns);
    }, 750 + Math.random() * 500);
  }
}

/* hand interaction */
// my turn: tap table cards to pick what to take (tap again to unpick), tap a hand card to pick it,
// tap that hand card again to play it with the picked table cards (none picked = just put it down)
$("myHand").addEventListener("click", e => {
  const el = e.target.closest(".card"); if (!el || !canPlay()) return;
  const id = el.dataset.id;
  takeErr = false;
  if (sel === id){
    const take = [...picks].filter(c => state.table.includes(c));
    const ns = applyMove(state, mi, id, take);
    if (ns){ sel = null; picks = new Set(); commit(ns); }
    else { takeErr = true; renderFinal(); }                         // that group can't be taken with this card
  } else { sel = id; renderFinal(); }
  e.stopPropagation();
});
$("table").addEventListener("click", e => {
  const el = e.target.closest(".card"); if (!el || !canPlay()) return;
  const id = el.dataset.id;
  takeErr = false;
  if (picks.has(id)) picks.delete(id); else picks.add(id);
  renderFinal();
  e.stopPropagation();
});
$("game").addEventListener("click", e => {
  if ((sel || picks.size) && !e.target.closest(".card") && !e.target.closest("button")){ sel = null; picks = new Set(); takeErr = false; renderFinal(); }
});

/* ================= modals ================= */
function closeModal(){ $("modalRoot").innerHTML = ""; openModal = null; }
function modal(html, wire){ $("modalRoot").innerHTML = `<div class="overlay"><div class="sheet">${html}</div></div>`; wire && wire($("modalRoot")); }

function showResult(){
  const s = state; if (!s || !s.over) return;
  openModal = showResult;
  const cols = seatOrder(s);                    // me first, then the others in playing order
  const w = s.res.w;
  const r = s.res;
  const done = s.mover;                         // this round ended the match
  const title = done
    ? (s.mw === mi ? t("winMatch") : t("loseMatch", {n:esc(playerName(s, s.mw))}))
    : (w < 0 ? t("draw") : (w === mi ? t("win") : t("lose", {n:esc(playerName(s, w))})));
  const icon = done ? (s.mw === mi ? "🏆" : "🃏") : (w === mi ? "⭐" : (w < 0 ? "🤝" : "🃏"));
  // one cell: what the player has, plus the points it earned
  const cell = (shown, pts) => `<td class="${pts ? "got" : ""}">${shown}${pts ? ` <span class="pt">+${pts}</span>` : ""}</td>`;
  const owns = (who, i, p) => cell(who === i ? "✓" : "—", who === i ? p : 0);
  const line = (label, f) => `<tr><td>${label}</td>${cols.map(f).join("")}</tr>`;
  const rows =
    line(esc(t("ptMost")), i => cell(s.cap[i], r.most === i ? 2 : 0)) +
    line("2♣", i => owns(s.c2, i, 1)) +
    line(`<span class="red">10♦</span>`, i => owns(s.d10, i, 1)) +
    line(esc(t("ptClubs")), i => cell(s.cl[i], r.clubs === i ? 1 : 0)) +
    `<tr class="total"><td>${esc(t("ptTotal"))}</td>${cols.map(i => `<td class="${w === i ? "win" : ""}">${r.pts[i]}</td>`).join("")}</tr>` +
    // running match total, the winner of the match in gold
    `<tr class="total match"><td>${esc(t("ptMatch"))}</td>${cols.map(i => `<td class="${done && s.mw === i ? "win" : ""}">${s.tot[i]}</td>`).join("")}</tr>`;
  const ties = (r.most < 0 ? [t("cardTie")] : []).concat(r.clubs < 0 ? [t("clubTie")] : []);
  modal(`<div style="text-align:center;font-size:40px">${icon}</div>
    <div class="result-title">${title}</div>
    <div class="result-sub">${esc(t("round", {n:s.round}))} · ${esc(t("matchLine", {g:s.target, m:cols.map(i => s.tot[i]).join("–")}))}</div>
    ${totalsLine(s)}
    <table class="rtable ${cols.length > 2 ? "four" : ""}"><tr><th></th>${cols.map(i => `<th><span class="nm">${esc(playerName(s, i))}</span></th>`).join("")}</tr>${rows}</table>
    ${ties.map(x => `<p class="note" style="margin:0 0 6px">${esc(x)}</p>`).join("")}
    <div class="btn-row"><button class="btn ghost" data-x="menu">${esc(t("menu"))}</button><button class="btn primary" data-x="again">${esc(t(done ? "newMatch" : "nextRound"))}</button></div>`,
    root => {
      // after the match is over there's nothing to rejoin, so forget the room; between rounds keep it
      root.querySelector("[data-x=menu]").onclick = () => { closeModal(); leaveGame(done); };
      root.querySelector("[data-x=again]").onclick = () => { closeModal(); commit(newRound(state.mode, state.p, state)); };
    });
}

/* ================= online (Firebase Realtime Database) =================
   rooms/<CODE>/created  uid of the player who made the room (seat 0)
   rooms/<CODE>/size     2 or 4 (missing = 2)
   rooms/<CODE>/target   points to win the match: 11 or 21 (missing = 11)
   rooms/<CODE>/seats    { 1: uid, 2: uid, 3: uid } — the other seats, claimed in order of joining
   rooms/<CODE>/players  { uid: name }
   rooms/<CODE>/state    the whole game as a JSON string (the one true copy)
   rooms/<CODE>/online   { uid: true } while that player has the page open
   matches/<group>/<matchId> { w: match winner's name (lowercase), t: time } — one entry per finished match;
     <group> is the players' names, lowercased and sorted, so each pair or foursome has its own record.
   (results/<group>/… holds per-round results from before matches existed; no longer read.) */
function genCode(){ const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 4; i++) s += a[rnd(a.length)]; return s; }

/* Leaving a room: a player who leaves (←, closed tab, lost connection) can rejoin for GONE_MS.
   Their online/<uid> turns into the server time they left; once that is GONE_MS old, any player still
   in the room writes rooms/<CODE>/closed, everyone is moved out, and nobody can join or rejoin it. */
const GONE_MS = 2 * 60 * 1000;
let srvOffset = 0;                                     // server clock minus my clock
const srvNow = () => Date.now() + srvOffset;
const TS = () => firebase.database.ServerValue.TIMESTAMP;
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
// time left before a player who left at server time v makes the game close
const goneLeft = v => GONE_MS - (srvNow() - v);
function offText(v){ return typeof v === "number" ? t("offline") + " · " + mmss(goneLeft(v)) : t("offline"); }

let fbReady = null, fb = null;
function fbInit(){
  if (fbReady) return fbReady;
  fbReady = new Promise((resolve, reject) => {
    if (!FIREBASE_CONFIG) return reject(new Error("notSetup"));
    if (typeof firebase === "undefined") return reject(new Error("noRoom"));
    try{
      // ?guest uses a separately named Firebase app, so it signs in as a different player (for testing in one browser)
      const appName = GUEST ? "guest" + GUEST : "[DEFAULT]";
      const app = firebase.apps.find(a => a.name === appName) || (GUEST ? firebase.initializeApp(FIREBASE_CONFIG, appName) : firebase.initializeApp(FIREBASE_CONFIG));
      const auth = app.auth(), db = app.database();
      let first = true;
      const un = auth.onAuthStateChanged(u => {
        if (u){
          un(); fb = { auth, db, uid:u.uid };
          db.ref(".info/serverTimeOffset").on("value", s => { srvOffset = s.val() || 0; });
          resolve(fb);
        }
        else if (first){ first = false; auth.signInAnonymously().catch(e => { un(); reject(e); }); }
      });
    }catch(e){ reject(e); }
  });
  fbReady.catch(() => { fbReady = null; });
  return fbReady;
}

async function goOnline(code, host, fresh, size){
  if (online) leaveOnline(false);
  show("lobby");
  $("lobbyChoose").classList.add("hidden"); $("lobbyWait").classList.remove("hidden");
  $("codeShow").textContent = code; $("copyBtn").textContent = t("copy");
  $("copyBtn").classList.toggle("hidden", !host);
  document.querySelector('#lobbyWait [data-i="shareCode"]').classList.toggle("hidden", !host);
  lobbyNote("");
  state = null;
  const o = online = { code, host, size: size || 2, target: matchTarget, subs:[], players:{}, onlineMap:{}, stateLoaded:false, connected:null, totals:null, totalsKey:null, recorded:new Set(), room:null };
  refreshLobbyText();
  // forget = the room is gone for good, so drop "Rejoin" for it too
  const fail = (key, forget) => { if (online !== o) return; leaveOnline(false); if (forget) forgetRoom(code); show("lobby"); lobbyChoose(); lobbyNote(t(key), true); };

  let f;
  try{ f = await fbInit(); }catch(e){ return fail(e && e.message === "notSetup" ? "notSetup" : "noRoom"); }
  if (online !== o) return;
  let room = f.db.ref("rooms/" + code);

  try{
    if (fresh){
      // claim an unused code; the rules refuse a code that already exists
      for (let tries = 0; ; tries++){
        try{ await room.child("created").set(f.uid); break; }
        catch(e){
          if (tries >= 5) throw e;
          code = genCode(); o.code = code; room = f.db.ref("rooms/" + code);
          $("codeShow").textContent = code;
        }
        if (online !== o) return;
      }
      await room.child("size").set(o.size);
      await room.child("target").set(o.target);
    } else {
      // seat 0 is the creator; the others take seats 1..size-1 in the order they join
      const [cr, sz, tg, st, ps, on, cl] = await Promise.all(["created", "size", "target", "seats", "players", "online", "closed"].map(k => room.child(k).once("value")));
      if (online !== o) return;
      if (!cr.exists()) return fail("noHost");
      o.size = sz.val() === 4 ? 4 : 2;
      o.target = tg.val() === 21 ? 21 : 11;
      refreshLobbyText();
      const seats = st.val() || {}, players = ps.val() || {}, onMap = on.val() || {};
      const mine = cr.val() === f.uid || Object.values(seats).includes(f.uid);
      // closed, or someone (me included) left more than 2 minutes ago: the room is over
      if (cl.exists()) return fail("ended", true);
      if (Object.keys(players).some(uid => typeof onMap[uid] === "number" && goneLeft(onMap[uid]) <= 0)){
        if (mine && players[f.uid]) room.child("closed").set(TS()).catch(() => {});
        return fail("ended", true);
      }
      if (!mine){
        const taken = Object.entries(players).some(([uid, nm]) => uid !== f.uid && nameKey(nm) === nameKey(myName()));
        if (taken) return fail("nameTaken");
        let got = false;
        for (let i = 1; i < o.size && !got; i++){
          if (seats[i]) continue;
          try{ await room.child("seats/" + i).set(f.uid); got = true; }catch(e){ /* someone took it first; try the next */ }
          if (online !== o) return;
        }
        if (!got) return fail("full");
      }
    }
    await room.child("players/" + f.uid).set(myName().slice(0,16));
  }catch(e){ return fail("connErr"); }
  if (online !== o) return;
  o.room = room;
  saveSession(o);
  refreshLobbyText();

  // my presence: true while connected; when I leave or drop it becomes the server time I left
  const meOn = room.child("online/" + f.uid);
  o.subs.push(() => { try{ meOn.onDisconnect().cancel(); meOn.set(TS()).catch(() => {}); }catch(e){} });
  watch(o, f.db.ref(".info/connected"), "value", snap => {
    if (online !== o) return;
    o.connected = !!snap.val();
    if (o.connected){
      // back after more than 2 minutes away (e.g. the connection dropped): the game is over for me
      meOn.once("value").then(ms => {
        if (online !== o) return;
        const v = ms.val();
        if (typeof v === "number" && goneLeft(v) <= 0) return closeRoom(o, f.uid);
        meOn.onDisconnect().set(TS()); meOn.set(true).catch(() => {});
      }).catch(() => {});
    }
    if (state && !busy) renderFinal();
  });
  // someone closed the room (a player was gone too long): everyone leaves it
  watch(o, room.child("closed"), "value", snap => { if (online === o && snap.exists()) roomClosed(o, goneUid(o)); });
  watch(o, room.child("players"), "value", snap => {
    if (online !== o) return;
    o.players = snap.val() || {};
    refreshLobbyText();
    if (state && !busy) renderFinal();
    maybeStart(o);
  });
  watch(o, room.child("online"), "value", snap => {
    if (online !== o) return;
    o.onlineMap = snap.val() || {};
    if (state && !busy) renderFinal();
  });
  watch(o, room.child("state"), "value", snap => onRemoteState(o, snap.val()));
}

// once every seat is filled and there is no game yet, anyone may deal; the first write wins
async function maybeStart(o){
  if (online !== o || !o.stateLoaded || state || !fb) return;
  if (Object.keys(o.players).length < o.size) return;
  let creator = null, seats = {};
  try{
    [creator, seats] = await Promise.all([o.room.child("created").once("value"), o.room.child("seats").once("value")]).then(([a, b]) => [a.val(), b.val() || {}]);
  }catch(e){ return; }
  if (online !== o || state) return;
  // seat order is the playing order: creator, then seats 1, 2, 3
  const order = [creator];
  for (let i = 1; i < o.size; i++) order.push(seats[i]);
  if (order.some(uid => !uid || !o.players[uid])) return;   // a seat is claimed but its name isn't saved yet
  const ns = newRound("online", order.map(uid => ({cid:uid, name:String(o.players[uid]).slice(0,16)})), null, o.target);
  enterGame(o, ns);
  commit(ns);
}

// take my seat in this game and switch to the game screen
function enterGame(o, g){
  mi = g.p.findIndex(x => x && x.cid === fb.uid);
  if (screen !== "game") show("game");
  watchTotals(o, g);
}

function onRemoteState(o, raw){
  if (online !== o) return;
  o.stateLoaded = true;
  let g = null; try{ g = raw ? JSON.parse(raw) : null; }catch(e){}
  if (!g || g.v !== STATE_V){ if (!state) maybeStart(o); return; }   // empty room, or a game saved by an older version
  if (!validState(g) || g.mode !== "online") return;
  const idx = g.p.findIndex(x => x && x.cid === fb.uid);
  if (idx < 0) return;
  if (state && state.id === g.id && state.seq === g.seq) return;   // already showing it
  enterGame(o, g);
  setState(g);
  recordResult(o, g);
}

// play a move / new round: show it at once, then save it; the server keeps whichever arrived first
function commit(ns){
  if (!(ns.mode === "online" && online && online.room)) { setState(ns); return; }
  const o = online, raw = JSON.stringify(ns);
  setState(ns);
  recordResult(o, ns);
  o.room.child("state").transaction(cur => {
    if (cur){ try{ const c = JSON.parse(cur); if (c.v === ns.v && c.seq >= ns.seq) return; }catch(e){} }
    return raw;
  }, err => { if (err) console.warn("purti: save failed", err.message); }, false);
}

// all-time record for exactly this group of players (a pair or a foursome)
function watchTotals(o, g){
  const key = groupKey(g.p.map(x => x.name));
  if (o.totalsKey === key) return;
  o.totalsKey = key;
  watch(o, fb.db.ref("matches/" + key), "value", snap => {
    if (online !== o || !state) return;
    const tot = { wins:{}, draws:0, games:0 };
    snap.forEach(ch => {
      const r = ch.val() || {};
      tot.games++;
      if (!r.w) tot.draws++;
      else tot.wins[r.w] = (tot.wins[r.w] || 0) + 1;
    });
    o.totals = tot;
    if (!busy) renderFinal();
    if (openModal === showResult) showResult();
  });
}
// all-time wins for each player, in seat order starting with me
function totalsFor(s){
  const tot = s.mode === "online" && online && online.totals;
  if (!tot || !tot.games) return null;
  return { draws: tot.draws, list: seatOrder(s).map(i => ({ name: s.p[i].name, wins: tot.wins[nameKey(s.p[i].name)] || 0 })) };
}

// save a finished match (not each round) to the group's all-time record
function recordResult(o, g){
  if (!g.mover || o.recorded.has(g.match) || !fb) return;
  o.recorded.add(g.match);
  const w = nameKey(g.p[g.mw].name);
  // every player may try to save the same match; only the first one is kept
  fb.db.ref("matches/" + groupKey(g.p.map(x => x.name)) + "/" + g.match)
    .transaction(cur => cur ? undefined : { w, t: Date.now() }, () => {}, false);
}

function totalsLine(s){
  const tt = totalsFor(s);
  if (!tt) return "";
  const draws = tt.draws ? ` · ${tt.draws} ${esc(t(tt.draws === 1 ? "drawW" : "drawsW"))}` : "";
  const body = tt.list.length === 2
    ? `${esc(tt.list[0].name)} ${tt.list[0].wins} – ${tt.list[1].wins} ${esc(tt.list[1].name)}`
    : tt.list.map(x => `${esc(x.name)} ${x.wins}`).join(" · ");
  return `<div class="result-sub" style="margin-top:-10px">${esc(t("allTime"))}: ${body}${draws}</div>`;
}

function leaveOnline(clearSession){
  if (!online) return;
  if (online.room && !clearSession) saveSession(online);   // the 2 minutes to rejoin start now
  online.subs.forEach(fn => { try{ fn(); }catch(e){} });
  online = null;
  if (clearSession) store.del("session");
}

// forget = true after a finished round; leaving mid-round with ← keeps "Rejoin" in case it was an accident
function leaveGame(forget){
  clearTimeout(aiTimer); aiTimer = null;
  leaveOnline(!!forget);
  state = null; busy = false; sel = null;
  closeModal();
  show("home"); updateRejoin();
}

// the room I'm in, for "Rejoin"; "at" is when I was last in it (kept fresh every second while I am)
function saveSession(o){ store.set("session", { code:o.code, host:o.host, at:Date.now() }); }
function forgetRoom(code){ const s = store.get("session"); if (s && s.code === code) store.del("session"); }

// the player who has been gone longest (others before me), or null
function goneUid(o){
  const gone = Object.keys(o.players || {}).filter(u => typeof o.onlineMap[u] === "number");
  const others = gone.filter(u => u !== fb.uid);
  return (others.length ? others : gone).sort((a, b) => o.onlineMap[a] - o.onlineMap[b])[0] || null;
}
// I see someone gone more than 2 minutes: close the room for everyone
function closeRoom(o, uid){
  if (online !== o) return;
  o.room.child("closed").set(TS()).catch(() => {});     // refused if it's already closed; fine
  roomClosed(o, uid);
}
// move out of a closed room, back to the home screen, and say why
function roomClosed(o, uid){
  if (online !== o) return;
  const msg = uid && uid === fb.uid ? t("closedMe")
    : uid && o.players[uid] ? t("closedBy", {n:o.players[uid]}) : t("ended");
  clearTimeout(aiTimer); aiTimer = null;
  leaveOnline(true);
  state = null; busy = false; sel = null; picks = new Set(); takeErr = false;
  closeModal();
  show("home"); updateRejoin();
  notice(msg);
}

// every second: keep my room's "Rejoin" fresh, count down offline players, close the room when one is gone too long
setInterval(() => {
  const o = online;
  if (o && o.room){
    saveSession(o);
    if (o.connected){
      const uid = Object.keys(o.players || {}).find(u => u !== fb.uid && typeof o.onlineMap[u] === "number" && goneLeft(o.onlineMap[u]) <= 0);
      if (uid) return closeRoom(o, uid);
    }
    document.querySelectorAll("#opps .chip.off[data-gone]").forEach(el => { el.textContent = offText(+el.dataset.gone); });
  }
  if (screen === "home") updateRejoin();
}, 1000);
window.addEventListener("pagehide", () => { if (online && online.room) saveSession(online); });

// "Rejoin" shows for 2 minutes after I left the room, then it's gone for good
function updateRejoin(){
  let s = store.get("session");
  const left = s && s.code && typeof s.at === "number" ? GONE_MS - (Date.now() - s.at) : 0;
  if (s && left <= 0){ store.del("session"); s = null; }
  $("rejoinRow").classList.toggle("hidden", !s);
  if (s) $("rejoinBtn").textContent = t("rejoin", {c:s.code, s:mmss(left)});
  $("forgetBtn").setAttribute("aria-label", t("forget"));
  $("forgetBtn").title = t("forget");
}

function saveName(){ me.name = $("nameInput").value.trim().slice(0,16); store.set("name", me.name); }

/* ================= wiring ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "lang"){ const l = b.dataset.lang; if (T[l] && l !== lang){ lang = l; store.set("lang", lang); applyLang(); } }
  else if (a === "ai") startAI();
  else if (a === "friend") openLobby();
  else if (a === "home"){ leaveOnline(true); show("home"); updateRejoin(); }
  else if (a === "forget"){ store.del("session"); updateRejoin(); }
  else if (a === "target"){ matchTarget = +b.dataset.target === 21 ? 21 : 11; store.set("target", matchTarget); refreshTargetPick(); }
  else if (a === "size"){ roomSize = +b.dataset.size === 4 ? 4 : 2; store.set("size", roomSize); refreshLobbyText(); }
  else if (a === "create") goOnline(genCode(), true, true, roomSize);
  else if (a === "rejoin"){ saveName(); updateRejoin(); const s = store.get("session"); if (s) goOnline(s.code, s.host); }
  else if (a === "leave") leaveGame();
  else if (a === "copy"){
    const code = online && online.code;
    if (!code) return;
    try{ navigator.clipboard.writeText(code).then(() => { $("copyBtn").textContent = t("copied"); setTimeout(() => $("copyBtn").textContent = t("copy"), 1500); }).catch(() => {}); }catch(err){}
  }
});
$("joinForm").addEventListener("submit", e => {
  e.preventDefault();
  saveName();
  const code = $("codeInput").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 4){ $("codeInput").focus(); return; }
  goOnline(code, false);
});
$("codeInput").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); });
$("nameInput").value = me.name;
$("nameInput").addEventListener("change", saveName);

$("fan").innerHTML = cardHTML("AS") + cardHTML("JH") + cardHTML("10D");
applyLang();
show("home");
})();
</script>
